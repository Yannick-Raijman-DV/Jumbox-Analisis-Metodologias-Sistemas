<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>JUMBOX - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="min-h-screen bg-[#00375e] flex items-center justify-center p-4 font-['Hanken_Grotesk',sans-serif]">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-[#1f4e79] p-6 text-white flex items-center gap-3">
            <div class="w-12 h-12 bg-white rounded-xl p-1.5 flex items-center justify-center">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Jumbox" class="w-full h-full object-contain"/>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">JUMBOX SaaS</h1>
                <p class="text-xs font-['JetBrains_Mono'] text-emerald-300 uppercase">Gestión de Supermercados</p>
            </div>
        </div>

        <div class="p-6 space-y-5">
            {% include "partials/_flash.html" %}

            <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Usuario o Correo</label>
                    <input type="text" name="username" required autofocus placeholder="administrador / operario / cajero" class="w-full rounded-xl border-slate-300 text-sm focus:border-[#00375e] focus:ring-[#00375e]"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••" class="w-full rounded-xl border-slate-300 text-sm focus:border-[#00375e] focus:ring-[#00375e]"/>
                </div>
                <button type="submit" class="w-full bg-[#006c49] hover:bg-[#10b981] text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-xs text-slate-400 uppercase">o continuar con</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <a href="{{ url_for('auth.login_google') }}" class="w-full flex items-center justify-center gap-2 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2.5 rounded-xl text-sm transition-colors">
                <span class="material-symbols-outlined text-[18px] text-[#00375e]">account_circle</span>
                <span>Iniciar sesión con Google OAuth</span>
            </a>

            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs text-slate-600 font-['JetBrains_Mono']">
                <p class="font-bold text-slate-700 mb-1">Cuentas migradas de supermercado.sql (clave: 1234):</p>
                <p>• administrador (Admin) • operario (Operario) • cajero (Cajero)</p>
            </div>
        </div>
    </div>
</body>
</html>
