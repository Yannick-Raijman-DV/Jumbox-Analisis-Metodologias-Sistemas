{% extends "base.html" %}
{% block title %}JUMBOX - {{ titulo }}{% endblock %}
{% block content %}
<div class="bg-white p-10 rounded-2xl shadow-card text-center max-w-lg mx-auto my-12">
    <div class="w-16 h-16 rounded-full bg-surface-container-low text-primary flex items-center justify-center mx-auto mb-5">
        <span class="material-symbols-outlined text-4xl">sentiment_dissatisfied</span>
    </div>
    <h2 class="text-2xl font-bold text-primary mb-2">{{ titulo }}</h2>
    <p class="text-on-surface-variant mb-7">{{ mensaje }}</p>
    <a href="{{ url_for('main.index') }}" class="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-full text-sm font-semibold hover:bg-primary-container transition-colors">
        <span class="material-symbols-outlined text-[18px]">home</span>
        <span>Volver al inicio</span>
    </a>
    <p class="text-xs text-on-surface-variant/70 mt-6">Código {{ codigo }}</p>
</div>
{% endblock %}
